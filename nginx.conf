# The nginx-unprivileged base image already sets pid + all *_temp_path under
# /tmp, so no temp/pid relocation belongs here (re-declaring them is a fatal
# duplicate-directive error). Assets are served from /tmp/html, where the
# startup script writes the runtime-rewritten copy.
server {
    listen 8080;
    root /tmp/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;

    # Load-bearing for MCP Apps resourceDomains — hosts load widget assets cross-origin
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;

    # Stable endpoint fetched by the MCP server on resources/read
    location = /_mcp-app/index.html {
        try_files /index.html =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
